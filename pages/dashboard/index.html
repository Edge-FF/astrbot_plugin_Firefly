<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流萤认知外壳 — 调试面板</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">流萤认知外壳</h1>
      <span class="app-version">v0.2 · 调试面板</span>
    </div>
    <div class="header-right">
      <span id="status-badge" class="status-badge status-ok">已连接</span>
      <span id="injection-counter" class="injection-counter">注入: 0</span>
      <button id="btn-refresh-all" class="btn btn-sm" title="刷新全部">刷新</button>
    </div>
  </header>

  <!-- Tab 按钮与内容容器由 app.js 按 views/* 注册表生成 -->
  <nav id="tab-nav" class="tab-nav"></nav>
  <div id="tab-views"></div>
</div>

<!--
  显式引用 bridge SDK 并放置在所有业务脚本之前：
  - AstrBot 的 rewrite_plugin_page_html 会识别 "/api/plugin/page/bridge-sdk.js"
    并替换为带认证参数的完整 URL。
  - 经典 <script>（无 type/module/async/defer）会阻塞解析器，确保
    window.AstrBotPluginPage 在任何业务模块执行前已定义。
  - AstrBot 检测到 bridge-sdk.js 已在页面中后，不会再重复注入。
-->
<script src="/api/plugin/page/bridge-sdk.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
